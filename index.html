<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>L'Atelier des Styles</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root{ padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
  body{ margin:0; background:#f8f9fa; color:#1f2937; font-family:'Inter',system-ui,sans-serif; }

  /* Style pour le zoom photo plein écran */
  .image-modal {
    display: none;
    position: fixed;
    z-index: 9999;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.9);
    justify-content: center;
    align-items: center;
    cursor: pointer;
  }
  .modal-content-img {
    max-width: 90%;
    max-height: 85vh;
    border-radius: 12px;
    object-fit: contain;
    animation: zoomIn 0.2s ease-out;
  }
  .close-modal-img {
    position: absolute;
    top: 20px;
    right: 25px;
    color: white;
    font-size: 35px;
    font-weight: bold;
  }
  @keyframes zoomIn {
    from { transform: scale(0.85); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
</style>
</head>
<body>

<header class="bg-slate-900" style="padding-top:env(safe-area-inset-top,0px)">
  <div class="max-w-3xl mx-auto px-4 py-6 text-center">
    <div class="w-20 h-20 rounded-full mx-auto overflow-hidden border-4" style="border-color:#8ea492">
      <img src="logo.png.jpeg" alt="L'Atelier des Styles" class="w-full h-full object-cover">
    </div>
    <h1 class="text-white font-extrabold text-2xl mt-3 tracking-tight">L'Atelier des Styles</h1>
    <p class="text-sm mt-1" style="color:#8ea492">Modes &bull; Saisons &bull; Performance</p>
    <div class="inline-flex items-center gap-3 bg-white/10 rounded-full px-4 py-2 mt-4 text-xs text-white">
      <span class="flex items-center gap-1.5">
        <svg viewBox="0 0 24 24" class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6A19.79 19.79 0 012.11 4.18 2 2 0 014.11 2h3a2 2 0 012 1.72c.13.96.36 1.9.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.9.34 1.85.57 2.81.7A2 2 0 0122 16.92z"/></svg>
        0780236967
      </span>
      <span class="w-px h-3.5 bg-white/30"></span>
      <span class="flex items-center gap-1.5">
        <svg viewBox="0 0 24 24" class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 6l10 7 10-7"/></svg>
        latelierdesstylesdz@gmail.com
      </span>
    </div>
  </div>
</header>

<div class="bg-white border-b border-gray-200 sticky top-0 z-30">
  <div class="max-w-6xl mx-auto px-4 sm:px-6 py-3 flex items-center justify-between gap-3">
    <div class="flex items-center gap-2 bg-gray-100 rounded-full px-4 py-2 w-full max-w-md mx-auto">
      <svg viewBox="0 0 24 24" class="w-4 h-4 text-gray-400 shrink-0" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="searchInput" oninput="renderProducts(this.value)" placeholder="Rechercher un article (Baggy, Cargo, Hoodie...)" class="bg-transparent outline-none text-sm w-full text-gray-700 placeholder:text-gray-400">
    </div>
  </div>
</div>

<main class="max-w-6xl mx-auto px-4 sm:px-6 py-8">
  <div id="grid-products" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4"></div>
</main>

<footer class="border-t border-gray-200 py-6 text-center text-xs text-gray-500">L'Atelier des Styles — Alger, Algérie.</footer>

<!-- Modal de Commande -->
<div id="orderModal" class="hidden fixed inset-0 z-50 items-end sm:items-center justify-center bg-black/50 p-0 sm:p-4" onclick="closeOrderModal()">
  <div class="bg-white border border-gray-200 w-full sm:max-w-md rounded-t-2xl sm:rounded-2xl max-h-[92vh] overflow-y-auto" style="padding-bottom:env(safe-area-inset-bottom,0px)" onclick="event.stopPropagation()">
    <div class="p-5 sm:p-6">
      <div class="flex justify-between items-start mb-4">
        <h2 class="font-bold text-base" id="modalProductName">Commander</h2>
        <button onclick="closeOrderModal()" class="text-gray-400 hover:text-gray-900 text-xl leading-none">&times;</button>
      </div>

      <div id="qtyOptions" class="space-y-2 mb-4"></div>

      <div class="grid grid-cols-2 gap-3 mb-3">
        <div><label class="text-xs text-gray-500 block mb-1">Nom</label><input id="f_nom" class="w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-sm outline-none focus:border-[#8ea492]"></div>
        <div><label class="text-xs text-gray-500 block mb-1">Prénom</label><input id="f_prenom" class="w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-sm outline-none focus:border-[#8ea492]"></div>
      </div>
      <div class="mb-3"><label class="text-xs text-gray-500 block mb-1">Téléphone</label><input id="f_tel" type="tel" placeholder="05XX XX XX XX" class="w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-sm outline-none focus:border-[#8ea492]"></div>
      <div class="grid grid-cols-2 gap-3 mb-3">
        <div><label class="text-xs text-gray-500 block mb-1">Wilaya</label><select id="f_wilaya" onchange="updateTotal()" class="w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-sm outline-none focus:border-[#8ea492]"><option value="">Choisir</option></select></div>
        <div><label class="text-xs text-gray-500 block mb-1">Commune</label><input id="f_commune" class="w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-sm outline-none focus:border-[#8ea492]"></div>
      </div>
      <div class="grid grid-cols-2 gap-3 mb-3">
        <div><label class="text-xs text-gray-500 block mb-1">Taille</label><select id="f_taille" class="w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-sm outline-none focus:border-[#8ea492]"><option>S</option><option selected>M</option><option>L</option><option>XL</option></select></div>
        <div><label class="text-xs text-gray-500 block mb-1">Couleur</label><select id="f_couleur" class="w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-sm outline-none focus:border-[#8ea492]"></select></div>
      </div>
      <div class="mb-4">
        <label class="text-xs text-gray-500 block mb-1">Mode de livraison</label>
        <div class="grid grid-cols-2 gap-3">
          <label class="flex items-center gap-2 bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-sm cursor-pointer"><input type="radio" name="mode" value="domicile" checked onchange="updateTotal()"> À domicile</label>
          <label class="flex items-center gap-2 bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-sm cursor-pointer"><input type="radio" name="mode" value="desk" onchange="updateTotal()"> Bureau / Stop Desk</label>
        </div>
      </div>

      <div class="bg-gray-50 border border-gray-200 rounded-lg p-3 text-sm mb-4 space-y-1">
        <div class="flex justify-between text-gray-500"><span>Produit</span><span id="sumProduct">&mdash;</span></div>
        <div class="flex justify-between text-gray-500"><span>Livraison</span><span id="sumDelivery">&mdash;</span></div>
        <div class="flex justify-between font-semibold text-gray-900 border-t border-gray-200 pt-1 mt-1"><span>Total</span><span id="sumTotal">&mdash;</span></div>
      </div>

      <p id="formError" class="hidden text-red-600 text-xs mb-2"></p>
      <button onclick="submitOrder()" id="submitBtn" class="w-full text-white font-semibold py-3.5 rounded-xl transition-colors" style="background:#5f7a63" onmouseover="this.style.background='#4d6350'" onmouseout="this.style.background='#5f7a63'">Confirmer la commande</button>
    </div>
  </div>
</div>

<!-- Modal Zoom Photo -->
<div id="imageModal" class="image-modal" onclick="closeImageModal()">
  <span class="close-modal-img">&times;</span>
  <img class="modal-content-img" id="imgFull" alt="Zoom Produit">
</div>

<div id="successToast" class="hidden fixed inset-x-0 bottom-6 z-[60] flex justify-center px-4">
  <div class="bg-white border rounded-xl px-5 py-4 text-sm max-w-sm shadow-lg text-gray-800" style="border-color:#8ea492; margin-bottom:env(safe-area-inset-bottom,0px)">
    Commande confirmée ! Nous allons vous appeler pour valider l'expédition.
  </div>
</div>

<script>
/* ==========================================================
   ZONE DE PERSONNALISATION
   ========================================================== */
const GOOGLE_SHEETS_URL = "https://script.google.com/macros/s/AKfycbzbKhRpYx_wvWjqwAQG5KdlihDPlnjLdAXkOjpUIl3f_VdxaCd4U-XRm7Aln_yljwMe/exec";

const PRODUCTS = [
  { id:"p-1", name:"Baggy Jogger (Simple)", colors:["Noir","Kaki","Gris Chiné"],   stock:"En stock", price1:2500, price2:4000, img:"BAGGY JOGGER Simple.jpg", locked:false },
  { id:"p-2", name:"Baggy Nike",             colors:["Noir","Blanc","Gris","Rose Pâle"], stock:"En stock", price1:3200, price2:5500, img:"Nike_oversized_baggy.jpg", locked:false },
  { id:"p-3", name:"Cargo Pants",            colors:["Kaki","Noir","Beige"],         stock:"En stock", price1:2900, price2:4800, img:"cargo_pants.jpg", locked:false },
  { id:"p-4", name:"Hoodie Mi-Saison",       colors:["Noir","Bordeaux","Gris Chiné","Blanc"],stock:"En stock", price1:3500, price2:6000, img:"hoodie_pullover.jpg", locked:false },
  { id:"p-5", name:"T-shirt Oversized",      colors:["Noir","Blanc","Kaki"],         stock:"En stock", price1:1800, price2:3000, img:"t-shirt.jpg", locked:false },
  { id:"p-6", name:"Ensemble Jogging 2-Pièces", colors:["Noir","Kaki"],               stock:"Bientôt disponible", price1:5500, price2:9500, img:"2-piece.jpg", locked:true },
];

const ZONES = [
  { rate:{ domicile:400, desk:300 }, wilayas:["Tizi Ouzou","Béjaïa","Bouira","Boumerdès","Alger","Blida"] },
  { rate:{ domicile:600, desk:450 }, wilayas:["Sétif","Bordj Bou Arréridj","Jijel","Skikda","Annaba","Constantine","Guelma","Souk Ahras","Tipaza","Chlef","Mostaganem","Relizane","Aïn Defla","M'Sila","Batna","Oum El Bouaghi","Khenchela","Tébessa","Mila","El Tarf","Médéa","Tissemsilt"] },
  { rate:{ domicile:700, desk:500 }, wilayas:["Oran","Sidi Bel Abbès","Mascara","Tiaret","Tlemcen","Saïda","Aïn Témouchent","Naâma","Djelfa","Laghouat","Ghardaïa","El Bayadh"] },
  { rate:{ domicile:900, desk:700 }, wilayas:["Ouargla","El Oued","Touggourt","Biskra","Béchar","Adrar","Tamanrasset","Illizi","Tindouf","Timimoun","Bordj Badji Mokhtar","Ouled Djellal","Béni Abbès","In Salah","In Guezzam","Djanet","El M'Ghair","El Meniaa"] },
];
/* ========================================================== */

const DELIVERY_RATES = {};
ZONES.forEach(z => z.wilayas.forEach(w => DELIVERY_RATES[w] = z.rate));
const WILAYAS = Object.keys(DELIVERY_RATES).sort();

const ICON_HANGER = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="w-8 h-8"><path d="M12 4a1.8 1.8 0 100 3.6A1.8 1.8 0 0012 4z"/><path d="M12 7.6v1.8m0 0l-8.5 5.2c-.6.4-.3 1.4.4 1.4h16.2c.7 0 1-1 .4-1.4L12 9.4z"/></svg>';
const ICON_LOCK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="w-7 h-7"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg>';

function cardHTML(p){
  const overlay = p.locked
    ? '<div class="absolute inset-0 bg-white/90 flex flex-col items-center justify-center gap-1 text-center p-3 z-10 text-gray-700">'
      + ICON_LOCK + '<p class="font-bold text-sm mt-1">Bientôt disponible</p><p class="text-xs text-gray-500">Drop Automne</p></div>'
    : '';
  const orderBtn = p.locked
    ? '<button disabled class="w-full bg-gray-200 text-gray-400 font-semibold py-2.5 rounded-lg cursor-not-allowed text-sm">Indisponible</button>'
    : '<button onclick="openOrderModal(\'' + p.id + '\')" class="w-full text-white font-semibold py-2.5 rounded-lg transition-colors text-sm" style="background:#5f7a63" onmouseover="this.style.background=\'#4d6350\'" onmouseout="this.style.background=\'#5f7a63\'">Commander (Paiement à la livraison)</button>';

  return '<div class="relative rounded-xl border border-gray-200 bg-white overflow-hidden">'
    + '<div class="relative h-56 sm:h-60 bg-gray-100">'
    + overlay
    + '<span class="absolute top-3 left-3 text-white text-[11px] font-semibold px-2.5 py-1 rounded-full z-10" style="background:#5f7a63">' + p.stock + '</span>'
    + '<img src="' + p.img + '" alt="' + p.name + '" loading="lazy" onclick="openImageModal(\'' + p.img + '\')" class="absolute inset-0 w-full h-full object-cover cursor-pointer" onerror="this.style.display=\'none\'; this.nextElementSibling.style.display=\'flex\';">'
    + '<div class="absolute inset-0 hidden items-center justify-center text-gray-300">' + ICON_HANGER + '</div>'
    + '</div>'
    + '<div class="p-4">'
    + '<h3 class="font-semibold text-sm mb-1">' + p.name + '</h3>'
    + '<p class="text-xs text-gray-500 mb-3">Tailles S &middot; M &middot; L &middot; XL &mdash; Couleurs : ' + p.colors.join(', ') + '</p>'
    + '<div class="grid grid-cols-2 gap-2 mb-3 text-xs">'
    + '<div class="border border-gray-200 rounded-lg px-2 py-2 text-center"><p class="text-gray-500">1 pièce</p><p class="font-semibold text-gray-900">' + p.price1 + ' DA</p></div>'
    + '<div class="rounded-lg px-2 py-2 text-center" style="border:1px solid #8ea492; background:rgba(142,164,146,0.12)"><p style="color:#5f7a63">Pack de 2</p><p class="font-semibold text-gray-900">' + p.price2 + ' DA</p></div>'
    + '</div>'
    + orderBtn
    + '</div></div>';
}

function renderProducts(query = ''){
  const grid = document.getElementById('grid-products');
  const filtered = PRODUCTS.filter(p => p.name.toLowerCase().includes(query.toLowerCase()));
  if(filtered.length === 0){
    grid.innerHTML = '<div class="col-span-full text-center text-gray-400 py-8 text-sm">Aucun article trouvé.</div>';
  } else {
    grid.innerHTML = filtered.map(cardHTML).join('');
  }
}

document.getElementById('f_wilaya').innerHTML = '<option value="">Choisir</option>' + WILAYAS.map(w => '<option>' + w + '</option>').join('');
renderProducts();

let currentProduct = null;
let currentQty = 1;

function setQty(n){ currentQty = n; updateTotal(); }

function openOrderModal(id){
  currentProduct = PRODUCTS.find(p => p.id === id);
  currentQty = 1;
  document.getElementById('modalProductName').textContent = currentProduct.name;
  document.getElementById('qtyOptions').innerHTML =
    '<label class="flex items-center justify-between px-3 py-2.5 rounded-lg cursor-pointer text-sm" style="border:1px solid #8ea492; background:rgba(142,164,146,0.12)">'
    + '<span class="flex items-center gap-2"><input type="radio" name="qty" checked onchange="setQty(1)"> 1 pièce</span>'
    + '<span class="font-semibold">' + currentProduct.price1 + ' DA</span></label>'
    + '<label class="flex items-center justify-between px-3 py-2.5 rounded-lg border border-gray-200 cursor-pointer text-sm">'
    + '<span class="flex items-center gap-2"><input type="radio" name="qty" onchange="setQty(2)"> Pack de 2</span>'
    + '<span class="font-semibold" style="color:#5f7a63">' + currentProduct.price2 + ' DA</span></label>';
  document.getElementById('f_couleur').innerHTML = currentProduct.colors.map(c => '<option>' + c + '</option>').join('');
  document.getElementById('formError').classList.add('hidden');
  document.getElementById('orderModal').classList.remove('hidden');
  document.getElementById('orderModal').classList.add('flex');
  updateTotal();
}

function closeOrderModal(){
  document.getElementById('orderModal').classList.add('hidden');
  document.getElementById('orderModal').classList.remove('flex');
}

/* Fonctions pour le Zoom Photo */
function openImageModal(src){
  const modal = document.getElementById('imageModal');
  const modalImg = document.getElementById('imgFull');
  modalImg.src = src;
  modal.style.display = 'flex';
}

function closeImageModal(){
  document.getElementById('imageModal').style.display = 'none';
}

function updateTotal(){
  if (!currentProduct) return;
  const productPrice = currentQty === 1 ? currentProduct.price1 : currentProduct.price2;
  const wilaya = document.getElementById('f_wilaya').value;
  const mode = document.querySelector('input[name="mode"]:checked').value;
  const rates = DELIVERY_RATES[wilaya];
  const fee = rates ? (mode === 'domicile' ? rates.domicile : rates.desk) : 0;
  document.getElementById('sumProduct').textContent = productPrice + ' DA';
  document.getElementById('sumDelivery').textContent = wilaya ? fee + ' DA' : '\u2014';
  document.getElementById('sumTotal').textContent = wilaya ? (productPrice + fee) + ' DA' : productPrice + ' DA';
}

function submitOrder(){
  const nom = document.getElementById('f_nom').value.trim();
  const prenom = document.getElementById('f_prenom').value.trim();
  const tel = document.getElementById('f_tel').value.trim();
  const wilaya = document.getElementById('f_wilaya').value;
  const commune = document.getElementById('f_commune').value.trim();
  const taille = document.getElementById('f_taille').value;
  const couleur = document.getElementById('f_couleur').value;
  const mode = document.querySelector('input[name="mode"]:checked').value;
  const errEl = document.getElementById('formError');

  if (!nom || !prenom || !tel || !wilaya || !commune){
    errEl.textContent = "Merci de remplir tous les champs obligatoires.";
    errEl.classList.remove('hidden');
    return;
  }
  errEl.classList.add('hidden');

  const productPrice = currentQty === 1 ? currentProduct.price1 : currentProduct.price2;
  const fee = DELIVERY_RATES[wilaya][mode === 'domicile' ? 'domicile' : 'desk'];
  const total = productPrice + fee;

  const order = {
    nom, prenom, telephone: tel, wilaya, commune,
    produit: currentProduct.name, taille, couleur,
    quantite: currentQty, mode_livraison: mode === 'domicile' ? 'À domicile' : 'Bureau / Stop Desk',
    prix_produit: productPrice, frais_livraison: fee, total,
    date: new Date().toISOString()
  };

  const btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = "Envoi en cours...";

  fetch(GOOGLE_SHEETS_URL, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "text/plain" },
    body: JSON.stringify(order)
  })
    .catch(() => {})
    .finally(() => {
      btn.disabled = false; btn.textContent = "Confirmer la commande";
      closeOrderModal();
      const toast = document.getElementById('successToast');
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 5000);
    });
}
</script>
</body>
</html>
