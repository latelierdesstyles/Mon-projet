<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>L'Atelier des Styles — Modes · Saisons · Performance</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: { extend: {
      colors: { navy: '#132239', sage: '#8aa78a', brown: '#7a5240' },
      fontFamily: { sans: ['Inter','system-ui','sans-serif'] }
    } }
  };
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<style>
  :root{
    --bg:#ffffff; --bg-alt:#f6f6f4; --text:#14181f; --muted:#6b7280; --border:#e6e6e3;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --bg:#0c0f14; --bg-alt:#12161d; --text:#f2f2f0; --muted:#9aa0aa; --border:#232732; }
  }
  :root[data-theme="dark"]{ --bg:#0c0f14; --bg-alt:#12161d; --text:#f2f2f0; --muted:#9aa0aa; --border:#232732; }
  html{ scroll-padding-top:env(safe-area-inset-top,0px); scroll-behavior:smooth; }
  body{ margin:0; background:var(--bg); color:var(--text); font-family:'Inter',system-ui,sans-serif; }
</style>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useMemo } = React;

/* ==========================================================
   ZONE DE PERSONNALISATION
   ========================================================== */
const SITE_NAME = "L'Atelier des Styles";
const SLOGAN = "Modes · Saisons · Performance";
const LOGO_IMG = "logo.png.jpeg";
const CONTACT_PHONE = "0780236967";
const WHATSAPP_NUM = "213780236967"; 
const CONTACT_EMAIL = "latelierdesstylesdz@gmail.com";

const products = [
  { id:1,  name:"T-shirt d'Été Technique",              price:"À définir",  gender:"homme", category:"ete",        badge:"Nouveau", icon:"☀️", image:"https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=400&q=80" },
  { id:2,  name:"T-shirt Casual Été",                   price:"À définir",  gender:"homme", category:"ete",        badge:null,      icon:"☀️", image:"https://images.unsplash.com/photo-1583743814966-8936f5b7be1a?auto=format&fit=crop&w=400&q=80" },
  { id:3,  name:"Robe Légère Été",                      price:"À définir",  gender:"femme", category:"ete",        badge:"Promo",   icon:"☀️", image:"https://images.unsplash.com/photo-1572804013309-59a88b7e92f1?auto=format&fit=crop&w=400&q=80" },
  { id:4,  name:"Polo Homme Respirant",                 price:"À définir",  gender:"homme", category:"ete",        badge:null,      icon:"☀️", image:"https://images.unsplash.com/photo-1596755094514-f87e34085b2c?auto=format&fit=crop&w=400&q=80" },
  { id:5,  name:"Manteau Hiver Laine",                  price:"À définir", gender:"homme", category:"hiver",      badge:null,      icon:"❄️", image:"https://images.unsplash.com/photo-1539533113208-f6df8cc8b543?auto=format&fit=crop&w=400&q=80" },
  { id:6,  name:"Doudoune Femme Chaude",                price:"À définir", gender:"femme", category:"hiver",      badge:"Nouveau", icon:"❄️", image:"https://images.unsplash.com/photo-1544441893-675973e31985?auto=format&fit=crop&w=400&q=80" },
  { id:7,  name:"Pull en Maille Douce",                 price:"À définir",  gender:"femme", category:"hiver",      badge:null,      icon:"❄️", image:"https://images.unsplash.com/photo-1620799140188-3b2a02fd9a77?auto=format&fit=crop&w=400&q=80" },
  { id:8,  name:"Veste Imperméable Hiver",              price:"À définir", gender:"homme", category:"hiver",      badge:"Promo",   icon:"❄️", image:"https://images.unsplash.com/photo-1591047139829-d91aecb6caea?auto=format&fit=crop&w=400&q=80" },
  { id:9,  name:"Survêtement Complet",                  price:"À définir",  gender:"homme", category:"sportwear",  badge:null,      icon:"🏃", image:"https://images.unsplash.com/photo-1556821840-3a63f95609a7?auto=format&fit=crop&w=400&q=80" },
  { id:10, name:"Legging Sport Femme",                  price:"À définir",  gender:"femme", category:"sportwear",  badge:"Nouveau", icon:"🏃", image:"https://images.unsplash.com/photo-1506629082955-511b1aa562c8?auto=format&fit=crop&w=400&q=80" },
  { id:11, name:"Veste Running Légère",                 price:"À définir",  gender:"femme", category:"sportwear",  badge:null,      icon:"🏃", image:"https://images.unsplash.com/photo-1557004396-66e4174d14b0?auto=format&fit=crop&w=400&q=80" },
  { id:12, name:"Short Sport Homme",                    price:"À définir",  gender:"homme", category:"sportwear",  badge:"Promo",   icon:"🏃", image:"https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?auto=format&fit=crop&w=400&q=80" },
  { id:13, name:"Veste Pêche Multi-poches",             price:"À définir",  gender:"homme", category:"peche",      badge:null,      icon:"🎣", image:"https://images.unsplash.com/photo-1522067713837-5674c3d79032?auto=format&fit=crop&w=400&q=80" },
  { id:14, name:"Chapeau Pêche Anti-UV",                price:"À définir",  gender:"homme", category:"peche",      badge:"Nouveau", icon:"🎣", image:"https://images.unsplash.com/photo-1582046399434-62e912fb63f2?auto=format&fit=crop&w=400&q=80" },
  { id:15, name:"Pantalon Imperméable Pêche",           price:"À définir", gender:"homme", category:"peche",      badge:null,      icon:"🎣", image:"https://images.unsplash.com/photo-1596541604085-78c66e2c3983?auto=format&fit=crop&w=400&q=80" }
];

const CATEGORIES = [
  { id:"tous",      label:"Tout voir",     icon:"✨" },
  { id:"ete",       label:"Collection Été",icon:"☀️" },
  { id:"hiver",     label:"Collection Hiver",icon:"❄️" },
  { id:"sportwear", label:"Sportwear",     icon:"🏃" },
  { id:"peche",     label:"Pêche & Outdoor",icon:"🎣" }
];

const GENDERS = [
  { id:"tous", label:"Tous" },
  { id:"homme", label:"Homme" },
  { id:"femme", label:"Femme" }
];

/* ==========================================================
   COMPOSANTS UI REUTILISABLES
   ========================================================== */
const ImageWithFallback = ({ src, alt, icon, className }) => {
  const [error, setError] = useState(false);
  if (error || !src) {
    return (
      <div className={`flex items-center justify-center bg-gray-100 text-gray-400 ${className}`}>
        <div className="text-center">
          <span className="text-4xl block mb-2">{icon}</span>
          <span className="text-sm font-medium">Image non disponible</span>
        </div>
      </div>
    );
  }
  return <img src={src} alt={alt} className={className} onError={() => setError(true)} />;
};

/* ==========================================================
   APPLICATION PRINCIPALE
   ========================================================== */
function App() {
  const [activeCategory, setActiveCategory] = useState("tous");
  const [activeGender, setActiveGender] = useState("tous");
  const [searchQuery, setSearchQuery] = useState("");

  const filteredProducts = useMemo(() => {
    return products.filter(p => {
      const matchCategory = activeCategory === "tous" || p.category === activeCategory;
      const matchGender = activeGender === "tous" || p.gender === activeGender;
      const matchSearch = p.name.toLowerCase().includes(searchQuery.toLowerCase());
      return matchCategory && matchGender && matchSearch;
    });
  }, [activeCategory, activeGender, searchQuery]);

  return (
    <div className="min-h-screen pb-20">
      
      {/* 1. HEADER (Logo + Nom + Slogan + Contact) */}
      <header className="bg-navy text-white pt-12 pb-16 px-4 rounded-b-[2rem] shadow-xl relative overflow-hidden">
        <div className="absolute inset-0 opacity-10 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-white via-transparent to-transparent"></div>
        <div className="relative max-w-5xl mx-auto flex flex-col items-center text-center">
          <div className="w-24 h-24 md:w-32 md:h-32 rounded-full border-4 border-sage p-1 bg-white shadow-lg mb-6">
             <img src={LOGO_IMG} alt="Logo" className="w-full h-full rounded-full object-cover" />
          </div>
          <h1 className="text-3xl md:text-5xl font-extrabold tracking-tight mb-3">
            {SITE_NAME}
          </h1>
          <p className="text-sage font-medium text-lg md:text-xl max-w-lg mb-6">
            {SLOGAN}
          </p>
          
          {/* Bloc de contact */}
          <div className="flex flex-col sm:flex-row gap-4 items-center justify-center bg-white/10 p-4 rounded-xl backdrop-blur-sm border border-white/20">
            <a href={`tel:${CONTACT_PHONE}`} className="flex items-center gap-2 text-white hover:text-sage transition-colors font-medium">
              <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
              {CONTACT_PHONE}
            </a>
            <span className="hidden sm:inline text-white/30">|</span>
            <a href={`mailto:${CONTACT_EMAIL}`} className="flex items-center gap-2 text-white hover:text-sage transition-colors font-medium">
              <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
              {CONTACT_EMAIL}
            </a>
          </div>
        </div>
      </header>

      {/* 2. FILTRES & RECHERCHE */}
      <div className="max-w-6xl mx-auto px-4 -mt-6 relative z-10">
        <div className="bg-white rounded-2xl shadow-lg p-4 md:p-6 border border-gray-100 flex flex-col md:flex-row gap-4 justify-between items-center">
          
          <div className="flex bg-gray-100 p-1 rounded-lg w-full md:w-auto">
            {GENDERS.map(g => (
              <button
                key={g.id}
                onClick={() => setActiveGender(g.id)}
                className={`flex-1 md:flex-none px-6 py-2 rounded-md text-sm font-semibold transition-all ${activeGender===g.id ? 'bg-white text-navy shadow-sm':'text-gray-500 hover:text-gray-700'}`}
              >
                {g.label}
              </button>
            ))}
          </div>

          <div className="relative w-full md:w-72">
            <span className="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
              <svg className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
            </span>
            <input 
              type="text" 
              placeholder="Rechercher un article..." 
              value={searchQuery}
              onChange={(e) => setSearchQuery(e.target.value)}
              className="w-full pl-10 pr-4 py-2 bg-gray-50 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-sage/50 focus:border-sage transition-all"
            />
          </div>
        </div>
      </div>

      {/* 3. NAVIGATION CATÉGORIES (Défilable sur mobile) */}
      <div className="max-w-6xl mx-auto px-4 mt-8 mb-8">
        <div className="flex overflow-x-auto pb-4 gap-3 snap-x scrollbar-hide">
          {CATEGORIES.map(cat => (
            <button
              key={cat.id}
              onClick={() => setActiveCategory(cat.id)}
              className={`snap-start whitespace-nowrap flex items-center gap-2 px-5 py-3 rounded-xl font-medium transition-all ${activeCategory===cat.id ? 'bg-sage text-white shadow-md transform scale-105':'bg-white text-gray-600 border border-gray-200 hover:bg-gray-50'}`}
            >
              <span>{cat.icon}</span>
              {cat.label}
            </button>
          ))}
        </div>
      </div>

      {/* 4. GRILLE PRODUITS */}
      <main className="max-w-6xl mx-auto px-4">
        {filteredProducts.length === 0 ? (
          <div className="text-center py-20 bg-white rounded-2xl border border-gray-100">
            <span className="text-4xl mb-4 block">🔍</span>
            <h3 className="text-xl font-bold text-gray-800 mb-2">Aucun article trouvé</h3>
            <p className="text-gray-500">Essayez de modifier vos filtres ou votre recherche.</p>
            <button onClick={() => {setActiveCategory('tous'); setActiveGender('tous'); setSearchQuery('');}} className="mt-6 px-6 py-2 bg-navy text-white rounded-lg hover:bg-navy/90 transition-colors">
              Réinitialiser les filtres
            </button>
          </div>
        ) : (
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            {filteredProducts.map(product => (
              <div key={product.id} className="bg-white rounded-2xl shadow-sm hover:shadow-xl transition-shadow duration-300 overflow-hidden border border-gray-100 flex flex-col group">
                
                {/* Image & Badge */}
                <div className="relative h-64 overflow-hidden bg-gray-50">
                  <ImageWithFallback src={product.image} alt={product.name} icon={product.icon} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" />
                  
                  {product.badge && (
                    <span className={`absolute top-3 left-3 px-3 py-1 text-xs font-bold uppercase tracking-wider rounded-full shadow-sm ${product.badge==='Promo' ? 'bg-red-500 text-white' : 'bg-navy text-white'}`}>
                      {product.badge}
                    </span>
                  )}
                  <span className="absolute top-3 right-3 bg-white/90 backdrop-blur-sm w-8 h-8 rounded-full flex items-center justify-center text-sm shadow-sm">
                    {product.icon}
                  </span>
                </div>

                {/* Infos */}
                <div className="p-5 flex flex-col flex-grow">
                  <div className="text-xs text-gray-400 font-medium uppercase tracking-wider mb-1">
                    {product.gender === 'homme' ? 'Pour Lui' : product.gender === 'femme' ? 'Pour Elle' : 'Mixte'}
                  </div>
                  <h3 className="text-lg font-bold text-gray-900 leading-tight mb-2 flex-grow">
                    {product.name}
                  </h3>
                  
                  <div className="flex items-end justify-between mt-4 mb-5">
                    <div>
                      <span className="text-sm text-gray-500 block mb-1">Prix unitaire</span>
                      <span className="text-2xl font-extrabold text-navy">
                        {product.price === "À définir" ? "À définir" : `${product.price} DA`}
                      </span>
                    </div>
                  </div>

                  {/* Bouton WhatsApp */}
                  <a
                    href={`https://wa.me/${WHATSAPP_NUM}?text=${encodeURIComponent(`Bonjour ! Je souhaite commander : ${product.name}`)}`}
                    target="_blank"
                    rel="noopener noreferrer"
                    className="w-full flex items-center justify-center gap-2 bg-[#25D366] hover:bg-[#20b958] text-white font-bold py-3 px-4 rounded-xl transition-colors shadow-sm"
                  >
                    <svg className="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51a12.8 12.8 0 00-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>
                    Commander
                  </a>
                </div>
              </div>
            ))}
          </div>
        )}
      </main>

    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
