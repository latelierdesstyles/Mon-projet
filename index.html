/* ==========================================================

   ========================================================== */
const ImageWithFallback = ({ src, alt, icon, className }) => {
  const [error, setError] = useState(false);
  if (error || !src) {
    return (
      <div className={`flex items-center justify-center bg-gray-100 text-gray-400 ${className}`}>
        <div className="text-center">
          <span className="text-4xl block mb-2">{icon}</span>
          <span className="text-sm font-medium">Image non disponible</span>
        </div>
      </div>
    );
  }
  return <img src={src} alt={alt} className={className} onError={() => setError(true)} />;
};

/* ==========================================================
   APPLICATION PRINCIPALE
   ========================================================== */
function App() {
  const [activeCategory, setActiveCategory] = useState("tous");
  const [activeGender, setActiveGender] = useState("tous");
  const [searchQuery, setSearchQuery] = useState("");

  const filteredProducts = useMemo(() => {
    return products.filter(p => {
      const matchCategory = activeCategory === "tous" || p.category === activeCategory;
      const matchGender = activeGender === "tous" || p.gender === activeGender;
      const matchSearch = p.name.toLowerCase().includes(searchQuery.toLowerCase());
      return matchCategory && matchGender && matchSearch;
    });
  }, [activeCategory, activeGender, searchQuery]);

  return (
    <div className="min-h-screen pb-20">
      
      {/* 1. HEADER (Logo + Nom + Slogan + Contact) */}
      <header className="bg-navy text-white pt-12 pb-16 px-4 rounded-b-[2rem] shadow-xl relative overflow-hidden">
        <div className="absolute inset-0 opacity-10 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-white via-transparent to-transparent"></div>
        <div className="relative max-w-5xl mx-auto flex flex-col items-center text-center">
          <div className="w-24 h-24 md:w-32 md:h-32 rounded-full border-4 border-sage p-1 bg-white shadow-lg mb-6">
             <img src={LOGO_IMG} alt="Logo" className="w-full h-full rounded-full object-cover" />
          </div>
          <h1 className="text-3xl md:text-5xl font-extrabold tracking-tight mb-3">
            {SITE_NAME}
          </h1>
          <p className="text-sage font-medium text-lg md:text-xl max-w-lg mb-6">
            {SLOGAN}
          </p>
          
          {/* Bloc de contact */}
          <div className="flex flex-col sm:flex-row gap-4 items-center justify-center bg-white/10 p-4 rounded-xl backdrop-blur-sm border border-white/20">
            <a href={`tel:${CONTACT_PHONE}`} className="flex items-center gap-2 text-white hover:text-sage transition-colors font-medium">
              <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
              {CONTACT_PHONE}
            </a>
            <span className="hidden sm:inline text-white/30">|</span>
            <a href={`mailto:${CONTACT_EMAIL}`} className="flex items-center gap-2 text-white hover:text-sage transition-colors font-medium">
              <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
              {CONTACT_EMAIL}
            </a>
          </div>
        </div>
      </header>

      {/* 2. FILTRES & RECHERCHE */}
      <div className="max-w-6xl mx-auto px-4 -mt-6 relative z-10">
        <div className="bg-white rounded-2xl shadow-lg p-4 md:p-6 border border-gray-100 flex flex-col md:flex-row gap-4 justify-between items-center">
          
          <div className="flex bg-gray-100 p-1 rounded-lg w-full md:w-auto">
            {GENDERS.map(g => (
              <button
                key={g.id}
                onClick={() => setActiveGender(g.id)}
                className={`flex-1 md:flex-none px-6 py-2 rounded-md text-sm font-semibold transition-all ${activeGender===g.id ? 'bg-white text-navy shadow-sm':'text-gray-500 hover:text-gray-700'}`}

            ))}

            </span>
            <input 
              type="text" 
              placeholder="Rechercher un article..." 
              value={searchQuery}
              onChange={(e) => setSearchQuery(e.target.value)}
              className="w-full pl-10 pr-4 py-2 bg-gray-50 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-sage/50 focus:border-sage transition-all"
            />
          </div>
        </div>
      </div>

              <span>{cat.icon}</span>
              {cat.label}
            </button>
          ))}
        </div>
      </div>

      {/* 4. GRILLE PRODUITS */}
      <main className="max-w-6xl mx-auto px-4">

          <div className="text-center py-20 bg-white rounded-2xl border border-gray-100">
            <span className="text-4xl mb-4 block">🔍</span>
            <h3 className="text-xl font-bold text-gray-800 mb-2">Aucun article trouvé</h3>
            <p className="text-gray-500">Essayez de modifier vos filtres ou votre recherche.</p>
            <button onClick={() => {setActiveCategory('tous'); setActiveGender('tous'); setSearchQuery('');}} className="mt-6 px-6 py-2 bg-navy text-white rounded-lg hover:bg-navy/90 transition-colors">
              Réinitialiser les filtres
            </button>
          </div>
        ) : (
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            {filteredProducts.map(product => (
              <div key={product.id} className="bg-white rounded-2xl shadow-sm hover:shadow-xl transition-shadow duration-300 overflow-hidden border border-gray-100 flex flex-col group">
                
                {/* Image & Badge */}
                <div className="relative h-64 overflow-hidden bg-gray-50">
                  <ImageWithFallback src={product.image} alt={product.name} icon={product.icon} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" />
                  
                  {product.badge && (
                    <span className={`absolute top-3 left-3 px-3 py-1 text-xs font-bold uppercase tracking-wider rounded-full shadow-sm ${product.badge==='Promo' ? 'bg-red-500 text-white' : 'bg-navy text-white'}`}>
                      {product.badge}
                    </span>
                  )}
                  <span className="absolute top-3 right-3 bg-white/90 backdrop-blur-sm w-8 h-8 rounded-full flex items-center justify-center text-sm shadow-sm">
                    {product.icon}
                  </span>
                </div>

                {/* Infos */}
                <div className="p-5 flex flex-col flex-grow">
                  <div className="text-xs text-gray-400 font-medium uppercase tracking-wider mb-1">
                    {product.gender === 'homme' ? 'Pour Lui' : product.gender === 'femme' ? 'Pour Elle' : 'Mixte'}
                  </div>
                  <h3 className="text-lg font-bold text-gray-900 leading-tight mb-2 flex-grow">
                    {product.name}
                  </h3>
                  
                  <div className="flex items-end justify-between mt-4 mb-5">
                    <div>
                      <span className="text-sm text-gray-500 block mb-1">Prix unitaire</span>
                      <span className="text-2xl font-extrabold text-navy">
                        {product.price === "À définir" ? "À définir" : `${product.price} DA`}
                      </span>
                    </div>
                  </div>

                  {/* Bouton WhatsApp */}
                  <a
                    href={`https://wa.me/${WHATSAPP_NUM}?text=${encodeURIComponent(`Bonjour ! Je souhaite commander : ${product.name}`)}`}
                    target="_blank"
                    rel="noopener noreferrer"
                    className="w-full flex items-center justify-center gap-2 bg-[#25D366] hover:bg-[#20b958] text-white font-bold py-3 px-4 rounded-xl transition-colors shadow-sm"
                  >
                    <svg className="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51a12.8 12.8 0 00-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>
                    Commander
                  </a>
                </div>
              </div>
            ))}
          </div>
        )}
      </main>

    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
